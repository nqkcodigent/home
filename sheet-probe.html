<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>sheet probe</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #14161c;
        color: #dfe6f2;
        font: 12px/1.4 ui-monospace, monospace;
      }
      h2 { margin: 10px 0 6px; font-size: 12px; color: #ffd166; }
      canvas { display: block; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <h2 id="title">sheet slice</h2>
    <canvas id="c"></canvas>
    <script>
      const q = new URLSearchParams(location.search);
      const file = q.get("file") || "/assets/characters/child/Puny-Characters/Character-Base.png";
      const zoom = Number(q.get("z") || 8);
      const FW = 32, FH = 32;
      // cells=c,r pairs
      const cells = (q.get("cells") || "0:0").split(",").map((s) => s.split(":").map(Number));

      const img = new Image();
      img.src = file;
      img.onload = () => {
        const padX = 8, gap = 6, labelH = 14;
        const cw = FW * zoom + gap;
        const c = document.getElementById("c");
        c.width = cells.length * cw + padX * 2;
        c.height = FH * zoom + labelH + padX * 2;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#0b0d12";
        ctx.fillRect(0, 0, c.width, c.height);
        cells.forEach(([col, row], i) => {
          const x = padX + i * cw;
          ctx.fillStyle = "#1b1f28";
          ctx.fillRect(x, padX + labelH, FW * zoom, FH * zoom);
          ctx.drawImage(img, col * FW, row * FH, FW, FH, x, padX + labelH, FW * zoom, FH * zoom);
          ctx.strokeStyle = "rgba(255,60,60,.55)";
          ctx.strokeRect(x + 0.5, padX + labelH + 0.5, FW * zoom - 1, FH * zoom - 1);
          // half-grid guides every 8px
          ctx.strokeStyle = "rgba(120,200,255,.18)";
          for (let g = 8; g < FW; g += 8) {
            ctx.beginPath();
            ctx.moveTo(x + g * zoom, padX + labelH);
            ctx.lineTo(x + g * zoom, padX + labelH + FH * zoom);
            ctx.moveTo(x, padX + labelH + g * zoom);
            ctx.lineTo(x + FW * zoom, padX + labelH + g * zoom);
            ctx.stroke();
          }
          ctx.fillStyle = "#ffd166";
          ctx.font = "11px ui-monospace, monospace";
          ctx.textAlign = "center";
          ctx.fillText(`c${col} r${row}`, x + (FW * zoom) / 2, padX + 10);
        });
        document.getElementById("title").textContent = `${file.split("/").pop()} — ${zoom}x — ${cells.map(([c, r]) => `c${c}r${r}`).join(" ")}`;
      };
    </script>
  </body>
</html>
